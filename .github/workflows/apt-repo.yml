name: Build & Publish APT repo

on:
  push:
    branches: [ "gh-pages" ]

permissions:
  contents: write

jobs:
  apt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required tools
        run: |
          sudo apt update
          sudo apt install -y gnupg dpkg-dev apt-utils

      - name: Import GPG private key
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf

          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | \
            gpg --batch --import

          gpg --list-secret-keys --keyid-format LONG

      - name: Generate Packages
        run: |
          mkdir -p dists/stable/main/binary-amd64
          mkdir -p dists/stable/main/binary-all

          dpkg-scanpackages pool /dev/null \
            > dists/stable/main/binary-amd64/Packages
          gzip -kf dists/stable/main/binary-amd64/Packages

      - name: Generate Release
        run: |
          cat > dists/stable/Release <<'EOF'
Origin: xWallet
Label: xWallet
Suite: stable
Codename: stable
Architectures: amd64 all
Components: main
Description: xWallet APT repository
EOF

          apt-ftparchive release dists/stable >> dists/stable/Release

      - name: Sign InRelease
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --local-user F1C9C0016564EB6B \
            --clearsign \
            -o dists/stable/InRelease \
            dists/stable/Release

      - name: Commit and push APT metadata
        run: |
    git config user.name "github-actions"
    git config user.email "github-actions@github.com"

    git add dists/stable || true

    if git diff --cached --quiet; then
      echo "No APT changes to commit"
      exit 0
    fi

    git commit -m "apt: update repository metadata"
    git push

