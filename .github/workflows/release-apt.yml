name: Build & Publish APT repo

on:
  push:
    branches: [ "gh-pages" ]

permissions:
  contents: write

jobs:
  apt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y gnupg dpkg-dev apt-utils

      - name: Import GPG key
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Generate Packages
        run: |
          mkdir -p dists/stable/main/binary-all
          dpkg-scanpackages pool /dev/null > dists/stable/main/binary-all/Packages
          gzip -kf dists/stable/main/binary-all/Packages

      - name: Generate Release (with headers)
        run: |
          cat > dists/stable/Release <<'EOF'
Origin: xWallet
Label: xWallet
Suite: stable
Codename: stable
Architectures: amd64 all
Components: main
Description: xWallet APT repository
EOF
          apt-ftparchive release dists/stable >> dists/stable/Release

      - name: Sign Release + InRelease
        env:
          KEYID: ${{ secrets.GPG_KEY_ID }}
          PASS: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # якщо ключ БЕЗ пароля — PASS можна не задавати і прибрати --passphrase
          gpg --batch --yes --pinentry-mode loopback \
            ${PASS:+--passphrase "$PASS"} \
            -u "$KEYID" -abs -o dists/stable/Release.gpg dists/stable/Release

          gpg --batch --yes --pinentry-mode loopback \
            ${PASS:+--passphrase "$PASS"} \
            -u "$KEYID" --clearsign -o dists/stable/InRelease dists/stable/Release

      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dists
          git commit -m "APT: auto-update metadata" || echo "No changes"
          git push
