name: Build DEB & Publish to APT repo

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Install build & repo tools
        run: |
          set -e
          sudo apt update
          sudo apt install -y \
            debhelper dh-python python3-all python3-pyqt5 python3-psutil \
            dpkg-dev gnupg apt-utils ca-certificates

      - name: Build deb package
        run: |
          set -e
          dpkg-buildpackage -us -uc

          mkdir -p pool/main/x
          cp ../xwallet-suite_*.deb pool/main/x/

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Generate Packages
        run: |
          set -e
          mkdir -p dists/stable/main/binary-all
          dpkg-scanpackages pool /dev/null > dists/stable/main/binary-all/Packages
          gzip -kf dists/stable/main/binary-all/Packages

      - name: Generate Release & InRelease
        env:
          PASS: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          apt-ftparchive release dists/stable > dists/stable/Release
          gpgconf --kill gpg-agent || true
          gpg --batch --yes --no-tty --pinentry-mode loopback \
            ${PASS:+--passphrase "$PASS"} \
            --clearsign \
            -o dists/stable/InRelease dists/stable/Release
          rm -f dists/stable/Release.gpg

      - name: Commit & push APT repo
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pool dists
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "APT: publish xwallet-suite ${GITHUB_REF_NAME}"
          git push
